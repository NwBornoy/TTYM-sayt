{% extends "admin/base.html" %}

{% block extrahead %}
  {{ block.super }}

  {% if admin_notifications_count is not None %}
  <script id="notif-data" type="application/json">
    {
      "count": {{ admin_notifications_count }},
      "items": [
        {% for n in admin_notifications %}
          {
            "text": "{{ n.text|escapejs }}",
            "url": "{{ n.url|escapejs }}"
          }{% if not forloop.last %},{% endif %}
        {% endfor %}
      ]
    }
  </script>

  <style>
    #notif-bell-wrapper {
      position: fixed;
      top: 12px;
      right: 100px;
      z-index: 100000;
    }
    #notif-bell-btn {
      background: #fff;
      border: none;
      border-radius: 50%;
      width: 33px;
      height: 32px;
      font-size: 18px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #notif-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #ff4757;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      line-height: 1;
      border: 2px solid #fff;
    }
    #notif-dropdown {
      display: none;
      position: fixed;
      top: 58px;
      right: 20px;
      background: #ffffff;
      color: #222;
      width: 320px;
      max-height: 400px;
      overflow-y: auto;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      z-index: 99999;
    }
    #notif-dropdown.is-open { display: block; }
    #notif-dropdown .notif-header {
      padding: 12px 16px;
      font-weight: 700;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      background: #fafafa;
      color: #172033;
    }
    #notif-dropdown .notif-item {
      display: block;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.5;
      color: #222;
      text-decoration: none;
      border-bottom: 1px solid #f2f2f2;
      background: #fff;
    }
    #notif-dropdown .notif-item:hover {
      background: #f7f7f7;
      color: #ff4757;
    }
    #notif-dropdown .notif-view-all {
      display: block;
      padding: 10px 16px;
      font-size: 13px;
      text-align: center;
      color: #ff4757;
      font-weight: 700;
      text-decoration: none;
      background: #fff;
    }
    #notif-dropdown .notif-empty {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 13px;
      background: #fff;
      
    }

        /* FAQAT TELEFON: qo'ng'iroqcha kichik, odamcha ikonkasining o'ng tomonida */
        @media (max-width: 768px) {
          #notif-bell-wrapper {
        top: 12px !important;
        right: 6px !important;
      
      }
      #notif-bell-btn {
        width: 28px;
        height: 28px;
        font-size: 14px;
        box-shadow: none;
      }
      #notif-badge {
        top: -5px;
        right: -5px;
        font-size: 9px;
        min-width: 14px;
        height: 14px;
        border-width: 1px;
      }
      #notif-dropdown {
        top: 56px;
        right: 8px;
        left: 8px;
        width: auto;
      }
    }

    @media (max-width: 480px) {
      .main-header.navbar form:nth-of-type(3),
      .main-header.navbar .form-inline:nth-of-type(3) {
        display: none !important;
      }
    }
    @media (max-width: 360px) {
      .main-header.navbar form:nth-of-type(2),
      .main-header.navbar .form-inline:nth-of-type(2) {
        display: none !important;
      }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var dataEl = document.getElementById('notif-data');
      if (!dataEl) {
        console.warn('notif-data topilmadi');
        return;
      }

      var data;
      try {
        data = JSON.parse(dataEl.textContent);
      } catch (err) {
        console.error('notif JSON xatosi:', err, dataEl.textContent);
        return;
      }

      var wrapper = document.createElement('div');
      wrapper.id = 'notif-bell-wrapper';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'notif-bell-btn';
      btn.innerHTML = '\uD83D\uDD14';

      if (data.count > 0) {
        var badge = document.createElement('span');
        badge.id = 'notif-badge';
        badge.textContent = data.count;
        btn.appendChild(badge);
      }

      wrapper.appendChild(btn);
      document.body.appendChild(wrapper);

      var dropdown = document.createElement('div');
      dropdown.id = 'notif-dropdown';

      var header = document.createElement('div');
      header.className = 'notif-header';
      header.textContent = 'Bildirishnomalar';
      dropdown.appendChild(header);

      if (data.items && data.items.length > 0) {
        data.items.forEach(function (item) {
          var a = document.createElement('a');
          a.className = 'notif-item';
          a.href = item.url;
          a.textContent = item.text;
          dropdown.appendChild(a);
        });

        var viewAll = document.createElement('a');
        viewAll.className = 'notif-view-all';
        viewAll.href = '/admin/blog/testimonial/?is_approved__exact=0';
        viewAll.textContent = "Barchasini ko'rish \u2192";
        dropdown.appendChild(viewAll);
      } else {
        var empty = document.createElement('div');
        empty.className = 'notif-empty';
        empty.textContent = "Yangi bildirishnoma yo'q \u2705";
        dropdown.appendChild(empty);
      }

      document.body.appendChild(dropdown);

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        dropdown.classList.toggle('is-open');
      });

      document.addEventListener('click', function (e) {
        if (!dropdown.contains(e.target) && e.target !== btn) {
          dropdown.classList.remove('is-open');
        }
      });

      console.log('Bildirishnoma qo\'ng\'irog\'i muvaffaqiyatli qo\'shildi. Son:', data.count);
    });
  </script>
  {% else %}
  <script>console.warn('admin_notifications_count topilmadi — context processor ishlamayapti');</script>
  {% endif %}
{% endblock %}
