<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 — Server xatosi</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #16326e, #2a5aa8);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 20px;
  }

  .error-card {
    background: #fff;
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  .error-icon {
    font-size: 60px;
    margin-bottom: 10px;
  }

  .error-code {
    font-size: 72px;
    font-weight: 800;
    color: #ed1c24;
    line-height: 1;
    margin: 10px 0 5px;
  }

  .error-title {
    font-size: 22px;
    font-weight: 700;
    color: #0B2438;
    margin-bottom: 14px;
  }

  .error-desc {
    font-size: 15px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .error-btn {
    display: inline-block;
    background: #ff4757;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 32px;
    border-radius: 8px;
    transition: background .2s;
  }

  .error-btn:hover {
    background: #e8404f;
  }

  @media (max-width: 480px) {
    .error-card {
      padding: 36px 24px;
    }
    .error-code {
      font-size: 54px;
    }
    .error-title {
      font-size: 18px;
    }
    .error-desc {
      font-size: 14px;
    }
    .error-btn {
      width: 100%;
      padding: 13px 20px;
    }
  }
</style>
</head>
<body>

  <div class="error-card">
    <div class="error-icon">⚠️</div>
    <div class="error-code">500</div>
    <div class="error-title">Serverda texnik nosozlik</div>
    <p class="error-desc">
      Kechirasiz, hozircha texnik nosozlik yuz berdi. Bizning mutaxassislar
      muammoni tezda bartaraf etishga harakat qilmoqda. Iltimos, birozdan
      so'ng qayta urinib ko'ring.
    </p>
    <a href="/" class="error-btn">Bosh sahifaga qaytish</a>
  </div>

</body>
</html>
