{% extends "blog/base.html" %}
{% load static %}

{% block title %}{{ topic.title }}{% endblock %}

{% block content %}

<style>
  .ac-hero {
    background: linear-gradient(90deg, #16326e, #2a5aa8);
    padding: 45px 40px;
    text-align: center;
  }

  .ac-hero h1 {
    color: #fff;
    font-size: 28px;
    margin: 0;
  }

  .ac-detail-page {
    max-width: 950px;
    margin: 40px auto 100px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 50px 60px;
  }

  .ac-detail-icon {
    text-align: center;
    color: #ff4757;
    font-size: 28px;
    margin-bottom: 15px;
  }

  .ac-detail-title {
    text-align: center;
    color: #0B2438;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .ac-detail-divider {
    width: 60px;
    height: 3px;
    background: #ff4757;
    margin: 0 auto 35px;
  }

  .ac-detail-body {
    color: #333;
    font-size: 16px;
    line-height: 1.9;
    text-align: justify;
  }

  .ac-detail-body p {
    margin: 0 0 18px;
  }

  .ac-detail-body strong {
    color: #0B2438;
  }

  .ac-back {
    display: inline-block;
    margin-top: 35px;
    color: #ff4757;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .ac-back:hover { text-decoration: underline; }

  /* PLANSHET (max 1024px) */
  @media (max-width: 1024px) {
    .ac-detail-page {
      margin: 30px auto 80px;
      padding: 40px 40px;
    }
  }

  /* TELEFON (max 768px) */
  @media (max-width: 768px) {
    .ac-hero { padding: 32px 20px; }
    .ac-hero h1 { font-size: 22px; }

    .ac-detail-page {
      margin: 20px 16px 60px;
      padding: 30px 24px;
      border-radius: 10px;
    }

    .ac-detail-title { font-size: 21px; }
    .ac-detail-body { font-size: 15px; line-height: 1.75; }
  }

  /* KICHIK TELEFONLAR (max 420px) */
  @media (max-width: 420px) {
    .ac-hero { padding: 26px 14px; }
    .ac-hero h1 { font-size: 19px; }

    .ac-detail-page {
      margin: 16px 10px 50px;
      padding: 22px 16px;
    }

    .ac-detail-title { font-size: 18px; }
    .ac-detail-body {
      font-size: 14.5px;
      text-align: left; /* justify kichik ekranda so'zlar orasi bo'sh joy qoldiradi */
    }
  }
</style>

<div class="ac-hero">
  <h1>Korrupsiyaga qarshi kurashish</h1>
</div>

<div class="ac-detail-page">
  <div class="ac-detail-icon">✱</div>
  <div class="ac-detail-title">{{ topic.title }}</div>
  <div class="ac-detail-divider"></div>

  <div class="ac-detail-body">{{ topic.body|safe }}</div>

  <a href="{% url 'anticorruption_list' %}" class="ac-back">← Ro'yxatga qaytish</a>
</div>

{% endblock %}
