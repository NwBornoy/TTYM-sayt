{% extends "blog/base.html" %}
{% load static %}

{% block title %}Korrupsiyaga qarshi kurashish{% endblock %}

{% block content %}

<style>
  .ac-hero {
    background: linear-gradient(90deg, #16326e, #2a5aa8);
    padding: 55px 40px;
    text-align: center;
  }

  .ac-hero h1 {
    color: #fff;
    font-size: 34px;
    margin: 0;
  }

  .ac-list-page {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 40px 100px;
  }

  .ac-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    background: #fff;
    border-left: 4px solid #2a5aa8;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    padding: 20px 25px;
    margin-bottom: 15px;
    text-decoration: none;
    transition: box-shadow .2s, transform .2s;
  }

  .ac-item:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    transform: translateY(-1px);
  }

  .ac-item-title {
    color: #16326e;
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.5;
  }

  .ac-item-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #dfe6f0;
    flex-shrink: 0;
  }
  .ac-item:hover .ac-item-dot {
    background: #2a5aa8;
  }

  .ac-empty {
    color: #999;
    text-align: center;
    padding: 30px 0;
  }
</style>

<div class="ac-hero">
  <h1>Korrupsiyaga qarshi kurashish</h1>
</div>

<div class="ac-list-page">

  {% for topic in topics %}
    <a href="{{ topic.get_absolute_url }}" class="ac-item">
      <span class="ac-item-title">{{ topic.title }}</span>
      <span class="ac-item-dot"></span>
    </a>
  {% empty %}
    <p class="ac-empty">Hozircha mavzular kiritilmagan.</p>
  {% endfor %}

</div>

{% endblock %}
